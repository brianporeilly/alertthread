# Local development stack.
#
# Started and stopped with `just up` / `just down`, which detect podman or
# docker and use whichever is installed. Nothing in this file is specific to
# either engine; keep it that way.
#
# ⚠️ SELinux, on Fedora. This file uses a *named volume* for PostgreSQL data
# rather than a bind mount, which sidesteps relabelling entirely — podman
# manages the volume's context itself.
#
# That is deliberate, and the constraint still applies the moment anyone adds a
# bind mount here. Any `- ./host:/path` entry MUST carry `:z` or `:Z`, or the
# container gets permission denied for reasons that look nothing like SELinux —
# the `demo` profile below mounts the Prometheus and Alertmanager configs and so
# every one of them carries `:z`:
#
#     - ./templates:/etc/alertthread/templates:z
#
# `:z` relabels shared, for content more than one container may read. `:Z`
# relabels private and will break any other consumer of the same directory.
#
# ── Profiles ──────────────────────────────────────────────────────────────────
# `postgres` and `slack-mock` have no profile, so `just up` starts exactly them —
# the everyday dev stack, unchanged. The end-to-end demo (relay + Prometheus +
# Alertmanager) sits behind the `demo` profile and starts only for `just e2e`,
# so an ordinary `just up` or `just test-pg` is not slowed down by it and does
# not need a Slack token to come up.
#
# ── Hardening ─────────────────────────────────────────────────────────────────
# The relay runs here the way it is meant to run in production: read-only root
# filesystem, every capability dropped, no new privileges, and a non-root uid
# baked into the image (65532, in the Dockerfile). That is not decoration on a
# dev stack — `just e2e` drives this compose file, so it is the only automated
# place those flags are proven not to break the relay at runtime.
#
# Writable paths are declared, never bought by relaxing read_only:
#   /data  the SQLite database, its -wal and its -shm
#   /tmp   where SQLite would put a spill file if a query ever needed one
#
# `seccomp` is not set here because both podman and docker apply their default
# profile already; the flag would only ever be used to switch it *off*.
# Kubernetes is the opposite — it defaults to Unconfined and needs
# `seccompProfile: RuntimeDefault` spelled out. See
# docs/src/how-to/harden-a-deployment.md, which carries the manifest.
#
# The other services get what fits them and no more. Prometheus and Alertmanager
# drop capabilities but keep a writable root filesystem (the note on the
# alertmanager service says why), and PostgreSQL is left alone entirely: its
# entrypoint runs as root to chown the data directory and drops privileges with
# su-exec, so `cap_drop: [ALL]` stops it initialising. None of the three is
# something this project ships.

name: alertthread

services:
  # PostgreSQL is opt-in for the relay (SQLite is the default) but the store
  # conformance suite runs against both, so it is always part of the dev stack.
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: alertthread
      POSTGRES_PASSWORD: alertthread
      POSTGRES_DB: alertthread
      # The dev database is thrown away constantly; durability costs more than
      # it buys here. Never do this anywhere real.
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      # #[sqlx::test] creates an isolated database per test and they run in
      # parallel, so the default of 100 is reachable.
      - -c
      - max_connections=200
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertthread -d alertthread"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Fake Slack: a web UI at http://localhost:8081 that renders messages *and*
  # threads, plus the three API methods the relay calls. This is what makes the
  # end-to-end threading behaviour visible without a real Slack workspace.
  slack-mock:
    build:
      context: .
      dockerfile: dev/slack-mock/Containerfile
    image: localhost/alertthread-slack-mock:dev
    ports:
      - "8081:8081"
    environment:
      RUST_LOG: info
    # The relay does its `auth.test` once at startup and fails fast on any error
    # (ADR 001 D11) — it does not retry — so it must not start until the mock is
    # actually listening. busybox `wget` is in the alpine runtime image.
    #
    # 127.0.0.1, not localhost: the server binds IPv4 only, and busybox resolves
    # `localhost` to ::1 first — which refuses, and the check never goes healthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/api/state"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    # It keeps its messages in memory and writes nothing, so read-only costs it
    # nothing. Hardened alongside the relay because it is the other image this
    # repository builds.
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  # ── demo profile ────────────────────────────────────────────────────────────
  # The relay under test, built from the release Dockerfile. Configured entirely
  # by environment (ADR 001): SQLite on a tmpfs, posting to the mock, defaulting
  # to #alerts. The collapse threshold is lowered so the five demo alerts trip
  # storm-collapse (ADR 001 D5) without needing a larger rule set.
  relay:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/alertthread:dev
    environment:
      ALERTTHREAD_SLACK__TOKEN: "xoxb-dev-mock-token-not-a-real-secret"
      ALERTTHREAD_SLACK__DEFAULT_CHANNEL: "#alerts"
      ALERTTHREAD_SLACK__BASE_URL: "http://slack-mock:8081/api/"
      ALERTTHREAD_STORAGE__BACKEND: "sqlite"
      ALERTTHREAD_STORAGE__URL: "sqlite:///data/state.sqlite"
      ALERTTHREAD_COLLAPSE__THRESHOLD: "3"
      # The webhook perimeter, on, so `just e2e` exercises it. Alertmanager sends
      # this in `http_config.authorization` — see dev/alertmanager/alertmanager.yml.
      # A demo credential in a demo stack; nothing here is a secret.
      ALERTTHREAD_SERVER__AUTH_TOKEN: "demo-webhook-token-not-a-secret"
      # Live since the reserved-names fix. RUST_LOG is the fallback the relay
      # consults when ALERTTHREAD_LOG is unset, and this stack deliberately
      # exercises the fallback rather than the primary: the demo is where the
      # ecosystem-reflex name gets proven, and the reference documents both.
      # `alertthread=debug` because watching the threading decisions is the
      # point of the demo.
      RUST_LOG: "info,alertthread=debug"
    ports:
      - "8080:8080"
    # SQLite lives on a tmpfs: the release image is `scratch` running as the
    # nonroot uid 65532, and a tmpfs mounts world-writable (mode 1777) so that
    # uid can create the database. A named volume would come up root-owned and
    # the relay could not write it. The data is throwaway, which a tmpfs suits.
    #
    # /tmp is the second declared write: nothing puts a file there today, but
    # SQLite spills a temp file for a large sort or an index rebuild, and the
    # place to find that out is here rather than in somebody's cluster.
    tmpfs:
      - /data
      - /tmp
    # Everything the hardening how-to tells an operator to set, set here, so the
    # end-to-end job is what proves the relay runs under it.
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      slack-mock:
        condition: service_healthy

  # Real Prometheus, evaluating the demo rule in dev/prometheus/rules.yml.
  prometheus:
    profiles: ["demo"]
    image: docker.io/prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --log.level=warn
    ports:
      - "9090:9090"
    volumes:
      # :z relabels for SELinux — mandatory on Fedora, harmless elsewhere.
      - ./dev/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:z
      - ./dev/prometheus/rules.yml:/etc/prometheus/rules.yml:z
    # Capabilities and privilege escalation, but not read_only — see the note on
    # the alertmanager service below.
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      alertmanager:
        condition: service_started

  # Real Alertmanager, routing to the relay's webhook. Its config carries the
  # two settings ADR 001 D8 says are mandatory and silently break the relay.
  alertmanager:
    profiles: ["demo"]
    image: docker.io/prom/alertmanager:v0.28.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --log.level=warn
    ports:
      - "9093:9093"
    volumes:
      - ./dev/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:z
    # No read_only on this one or on Prometheus, and the reason is worth writing
    # down because it was tried: both write to a data directory inside their own
    # WORKDIR, and a tmpfs over that path comes up with the *image* directory's
    # ownership (podman mounts it `tmpcopyup`) while both processes run as
    # `nobody`. Alertmanager fails with `Unable to create data directory` and the
    # demo never starts. Making it work means a pre-chowned volume, which buys
    # nothing here: these are third-party dev dependencies, not what this project
    # ships. The relay above is the artefact whose hardening this file proves.
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      relay:
        condition: service_started

volumes:
  postgres-data:
