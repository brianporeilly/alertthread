name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  # Every job below invokes a `just` recipe rather than reimplementing the
  # command. That equivalence is the point: AGENTS.md promises "CI runs these
  # same recipes, so if it passes locally it passes in CI", and spelling the
  # cargo flags out again here is exactly how that promise rots.
  lint:
    name: fmt + clippy + dependency direction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - run: just lint

  test:
    name: tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      # Runs the per-crate thresholds. This is the job that must be seen to
      # fail when coverage drops — a threshold nobody has watched reject
      # anything is not a gate.
      - run: just test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage/llvm-cov.json
          if-no-files-found: warn

  test-pg:
    name: postgres conformance + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      # The dev stack comes up through the same recipe developers use, on whichever
      # engine the runner has. `just up` detects podman or docker rather than
      # hardcoding either, which is the only reason this job works on a Docker-only
      # GitHub runner without a second code path to keep in sync.
      - run: just up
      # `just test-pg` runs the PostgreSQL half of the store's coverage gate. The
      # `test` job above compiles the SQLite backend only — see
      # scripts/coverage-gate.py — so this job is not an extra check on the same
      # code, it is the only place PostgresStore is measured at all.
      - run: just test-pg
      - if: always()
        run: just down
      - name: Upload PostgreSQL coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json-postgres
          path: coverage/llvm-cov-postgres.json
          if-no-files-found: warn

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  msrv:
    name: MSRV 1.94
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins the *build* toolchain and takes precedence over
      # `rustup override`, so installing 1.94 alone would silently still compile
      # with the pinned version and this job would prove nothing. RUSTUP_TOOLCHAIN
      # is one of the few things that outranks the file.
      RUSTUP_TOOLCHAIN: "1.94.0"
    steps:
      - uses: actions/checkout@v5
      # Pinned to the exact floor rather than `stable`. MSRV is dictated by
      # sqlx 0.9, not chosen, so this job exists to catch accidental use of a
      # newer language feature — which `stable` would happily compile.
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Confirm the MSRV toolchain is the one actually in use
        run: |
          rustc --version
          rustc --version | grep -q '1\.94\.' || {
            echo "MSRV job is not running on 1.94 — rust-toolchain.toml is winning." >&2
            exit 1
          }
      - run: cargo check --workspace --all-targets

  docs:
    name: mdbook + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: just docs

  rules:
    name: prometheus alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      # `promtool check rules` on deploy/alertthread.rules.yaml, from the pinned
      # Prometheus image. The rules are a shipped artefact and nothing else in the
      # repo compiles PromQL, so without this a syntax error reaches a cluster.
      # The other half — that every metric the rules name is one the binary
      # exports — is a unit test and runs in the `test` job.
      - run: just check-rules

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: azure/setup-helm@v4
      # scripts/chart-test.py asserts on parsed objects rather than on rendered
      # text, because a text match passes for a document that renders empty —
      # which the first draft of the PrometheusRule template actually did.
      - run: python3 -m pip install --user pyyaml
      - run: just chart

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      # Not taiki-e/install-action: it has no actionlint entry, falls back to
      # cargo-binstall, and actionlint is a Go binary rather than a crate, so
      # the fallback can only ever fail. Pinned release plus checksum instead.
      - name: install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f "$archive" actionlint
      # shellcheck is preinstalled on ubuntu runners; actionlint silently skips
      # every shell check when it is absent, so a local run without it is not
      # the same check as this one.
      - run: shellcheck --version
      # The release workflow's first real exercise is the first tag. A YAML or
      # expression error in it would surface there, which is the worst possible
      # moment, so it is linted on every pull request instead.
      - run: just check-workflows

  image:
    name: scratch image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      # Built through the same recipe developers use, on whichever engine the
      # runner has. The rationale for building it on every PR is in the recipe.
      - run: just image localhost/alertthread:ci

  e2e:
    name: end-to-end demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      # `just e2e` brings up the whole stack — relay + Prometheus + Alertmanager
      # + the fake Slack — through the same recipe developers run, on whichever
      # engine the runner has, and asserts against the mock's state that the
      # alert threaded and then resolved in place. This is Phase 4's exit
      # criterion as a gate. It is its own job rather than part of `just ci` so
      # the fast checks stay fast: a container build does not belong in the
      # inner loop.
      - run: just e2e
        timeout-minutes: 15

  # Single required status check, so branch protection does not need updating
  # every time a job is added.
  ci-success:
    name: CI
    if: always()
    needs: [lint, test, test-pg, deny, msrv, docs, rules, chart, workflows, image, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
