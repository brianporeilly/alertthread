name: Docs

# Publishes the mdBook to GitHub Pages.
#
# On a published release and on demand, not on push to `main`. The docs
# describe published artefacts — image tags, chart references, verification
# commands — and a site that runs ahead of the release describes things that do
# not exist yet.
#
# The book is *built* on every pull request already, by `just docs` in the CI
# workflow. This job only deploys it.
#
# One-time owner setup: Settings → Pages → Source: GitHub Actions. Until that is
# done this workflow fails at the deploy step, which is the visible direction to
# fail.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: mdbook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: mdbook
      # `just docs`, the same recipe the CI workflow runs: mdbook build plus the
      # intra-repo link check. book.toml sets create-missing = false, so a link
      # into a page that does not exist fails here rather than publishing a dead
      # link.
      - run: just docs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/book

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
