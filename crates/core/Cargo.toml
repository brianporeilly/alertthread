[package]
name = "alertthread-core"
description = "Pure decision logic for the alertthread Alertmanager-to-Slack relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# ---------------------------------------------------------------------------
# THIS CRATE IS PURE. It must not depend on tokio, sqlx, axum or reqwest, and
# must perform no I/O: no filesystem, no network, no clock reads, no RNG.
# Time enters as a `now: DateTime<Utc>` parameter.
#
# This is not a convention — `just check-deps` fails the build if it is
# violated, and CI runs that recipe. See scripts/check-deps.sh.
# ---------------------------------------------------------------------------
[dependencies]
# chrono without `clock`: see the comment on the workspace dependency. `Utc::now()`
# does not exist in this crate, by construction.
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Test-only. The golden fixtures are `include_str!`d at compile time and parsed here,
# so the crate still performs no filesystem I/O — and `--edges normal` in
# scripts/check-deps.sh means a dev-dependency cannot smuggle anything into the
# shipped graph.
serde_json.workspace = true

[lints]
workspace = true
