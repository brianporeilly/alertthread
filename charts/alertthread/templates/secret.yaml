{{- /*
Only ever holds a token the values file supplied. When `existingSecret` is set
the chart creates nothing and the Deployment mounts the Secret by name, so no
credential passes through Helm at all.
*/ -}}
{{- if not .Values.slack.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-slack" (include "alertthread.fullname" .) }}
  labels:
    {{- include "alertthread.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.slack.token | b64enc | quote }}
{{- end }}
{{- if and .Values.webhookAuth.enabled (not .Values.webhookAuth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-webhook" (include "alertthread.fullname" .) }}
  labels:
    {{- include "alertthread.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.webhookAuth.token | b64enc | quote }}
{{- end }}
