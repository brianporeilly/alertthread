apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alertthread.fullname" . }}
  labels:
    {{- include "alertthread.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "alertthread.configYaml" . | nindent 4 }}
{{- if include "alertthread.hasTemplates" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alertthread.fullname" . }}-templates
  labels:
    {{- include "alertthread.labels" . | nindent 4 }}
data:
  {{- range $name, $body := .Values.templates }}
  {{- if $body }}
  {{ $name }}: |
    {{- $body | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
