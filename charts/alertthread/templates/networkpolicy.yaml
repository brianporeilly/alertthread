{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "alertthread.fullname" . }}
  labels:
    {{- include "alertthread.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "alertthread.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # An ingress policy does not block the kubelet's probes: those come from the
    # node, not from a pod.
    - from:
        {{- range .Values.networkPolicy.ingressNamespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ (splitList ":" .Values.config.server.listen) | last | int }}
{{- end }}
