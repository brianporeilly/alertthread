apiVersion: v2
name: alertthread
description: Alertmanager to Slack relay with fingerprint-keyed threading and update-on-resolve
type: application

# Both numbers are release-please's; do not edit them by hand. One release train
# means one version, and every tag publishes an image, so `appVersion` always
# names a tag that exists. `scripts/release-version.py` fails the build when one
# of the four places the version lives is left behind.
#
# 0.0.0 means nothing has been released yet.
version: 0.0.0 # x-release-please-version
appVersion: "0.0.0" # x-release-please-version

# ServiceMonitor and PrometheusRule are monitoring.coreos.com/v1. The chart does
# not gate them on a capabilities check; see values.yaml under `metrics`.
kubeVersion: ">=1.25.0-0"

home: https://github.com/brianporeilly/alertthread
sources:
  - https://github.com/brianporeilly/alertthread

keywords:
  - alertmanager
  - prometheus
  - slack
  - alerting
  - observability

maintainers:
  - name: Brian O'Reilly
    url: https://github.com/brianporeilly

annotations:
  artifacthub.io/license: MIT OR Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/brianporeilly/alertthread/tree/main/docs
    - name: Harden a deployment
      url: https://github.com/brianporeilly/alertthread/blob/main/docs/src/how-to/harden-a-deployment.md
